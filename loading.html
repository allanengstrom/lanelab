<script>
  const NS = 'http://www.w3.org/2000/svg';
  const dotsG = document.getElementById('dots');

  const TRACKS = ['t0', 't1', 't2'].map(id => {
    const el = document.getElementById(id);
    return { el, len: el.getTotalLength() };
  });

  const SPAWN_MS  = 680;   // ms between dots per track
  const TRAVEL_MS = 2300;  // full journey duration per dot
  const DOT_R     = 5.2;   // max radius in SVG units
  const DOT_COLOR = '#ffffff';

  // stagger first spawn so dots don't all start together
  const STAGGER_MS = SPAWN_MS / TRACKS.length;

  const lastSpawn = [null, null, null];
  const dots = [];
  let origin = null;

  function frame(now) {
    if (!origin) origin = now;

    // spawn
    TRACKS.forEach(({ el, len }, i) => {
      const readyAt = origin + i * STAGGER_MS;
      if (now < readyAt) return;

      const prev = lastSpawn[i] ?? (readyAt - SPAWN_MS);
      if (now - prev >= SPAWN_MS) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('fill', DOT_COLOR);
        c.setAttribute('r', 0);
        dotsG.appendChild(c);
        dots.push({ c, ti: i, born: now });
        lastSpawn[i] = now;
      }
    });

    // update
    for (let i = dots.length - 1; i >= 0; i--) {
      const d = dots[i];
      const t = (now - d.born) / TRAVEL_MS;

      if (t >= 1) {
        d.c.remove();
        dots.splice(i, 1);
        continue;
      }

      const { el, len } = TRACKS[d.ti];
      const pt = el.getPointAtLength(t * len);
      d.c.setAttribute('cx', pt.x);
      d.c.setAttribute('cy', pt.y);

      // grow first 10%, hold, shrink last 18%
      const scale =
        t < 0.10 ? t / 0.10 :
        t > 0.82 ? (1 - t) / 0.18 : 1;
      d.c.setAttribute('r', DOT_R * Math.max(0, scale));
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
</script>
